# Production Configuration Profile ('prod')
# All sensitive credentials and secrets MUST be provided via environment variables in production.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

app.init.enabled=${APP_INIT_ENABLED:false}
app.init.admin-password=${APP_INIT_ADMIN_PASSWORD:}
app.init.user-password=${APP_INIT_USER_PASSWORD:}

jwt.signerKey=${JWT_SIGNER_KEY}
